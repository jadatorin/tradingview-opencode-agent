name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.js
            *.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
